name: Compilar y distribuir APK

# Corre en cada push a main y también a mano desde la pestaña Actions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Pasamos el secret a una variable de entorno del job.
    # Asi lo podemos leer en el "if" del paso de Firebase
    # (GitHub no permite usar secrets.* directamente en un if).
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Traer el código
        uses: actions/checkout@v5

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      # google-services.json está en .gitignore, así que en CI lo
      # reconstruimos desde un secret. Sin él la app compila igual,
      # solo que sin push al cuidador.
      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json escrito ($(wc -c < app/google-services.json) bytes)"
          else
            echo "Secret GOOGLE_SERVICES_JSON vacío: se compila sin push."
          fi

      - name: Compilar APK de debug
        env:
          # Vienen de Settings → Secrets and variables → Actions
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Si el secret no existe, la variable llega vacía y el build no
          # se rompe: el mapa queda gris con su cartel y Vita avisa que le
          # falta la clave. Es a propósito — un APK a medias se puede
          # probar, un build caído no.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      # Siempre queda descargable desde la pestaña Actions
      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: vimed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Avisa al celular para actualizar de un toque.
      # Se saltea solo si todavía no cargaste los secrets de Firebase.
      - name: Enviar a Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && github.event_name != 'pull_request' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          releaseNotes: |
            ${{ github.event.head_commit.message }}
          file: app/build/outputs/apk/debug/app-debug.apk
