plugins {
    alias(libs.plugins.android.application)
}

// El plugin de Google solo se aplica si ya bajaste google-services.json
// desde la consola de Firebase. Sin el archivo, el plugin ABORTA el build;
// haciéndolo condicional la app sigue compilando (solo que sin push).
def hayFirebase = file('google-services.json').exists()
if (hayFirebase) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json ausente: la app compila pero el push ' +
        'al cuidador va a quedar deshabilitado.')
}

// Claves de Supabase: local.properties en tu máquina (NO se commitea),
// variables de entorno en CI (GitHub Actions las inyecta desde Secrets).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// Se limpia TODO espacio en blanco (incluidos saltos de línea): al pegar
// el anon key —un JWT larguísimo— en un secret de GitHub es muy fácil que
// se cuele un enter, y eso generaba un BuildConfig.java con un string sin
// cerrar que rompía la compilación. Ni la URL ni el JWT llevan espacios,
// así que quitarlos es seguro.
def limpiar = { String v -> v == null ? '' : v.replaceAll('\\s', '') }

def supabaseUrl = limpiar(localProps.getProperty('SUPABASE_URL')
    ?: System.getenv('SUPABASE_URL'))
def supabaseAnonKey = limpiar(localProps.getProperty('SUPABASE_ANON_KEY')
    ?: System.getenv('SUPABASE_ANON_KEY'))

// Clave del mapa (Maps SDK for Android).
//
// Mostrar el mapa en Android NO se factura: el SDK no cobra por carga de
// mapa. Lo que se paga es Places, y esta app no lo usa — la búsqueda por
// nombre va con el Geocoder del sistema, que no pide clave ni cuenta.
// Aun así Google exige una cuenta de facturación para habilitar la clave.
//
// Restringila en Google Cloud a este paquete (com.tesis.vimed) y a la
// huella SHA-1 de tu firma: la clave viaja dentro del APK y se puede
// extraer, y esa restricción es lo único que impide que otro la use.
def mapsApiKey = limpiar(localProps.getProperty('MAPS_API_KEY')
    ?: System.getenv('MAPS_API_KEY'))

// Clave de OpenAI: la usa Vita para responder y para transcribir el audio.
//
// OJO: termina DENTRO del APK y se puede extraer. Para la tesis alcanza,
// pero si esto se distribuyera de verdad habría que ponerla detrás de una
// Edge Function de Supabase y que la app le pegue ahí.
def openAiKey = limpiar(localProps.getProperty('OPENAI_API_KEY')
    ?: System.getenv('OPENAI_API_KEY'))

// El modelo es configurable a propósito: durante las pruebas hay que
// correr las mismas preguntas contra varios y comparar cuál respeta el
// límite de no dar indicaciones médicas.
def openAiModelo = (localProps.getProperty('OPENAI_MODELO')
    ?: System.getenv('OPENAI_MODELO') ?: 'gpt-5-nano').trim()

if (supabaseUrl.isEmpty() || supabaseAnonKey.isEmpty()) {
    logger.warn('⚠ SUPABASE_URL / SUPABASE_ANON_KEY vacías: ' +
        'la app compilará pero no va a poder conectarse.')
} else if (!supabaseAnonKey.startsWith('eyJ') || supabaseAnonKey.count('.') != 2) {
    // El anon key es un JWT: empieza con "eyJ" y tiene exactamente 2 puntos.
    // Si no cumple, llegó cortado o se pegó otra cosa. Cortamos acá: un APK
    // con la clave mal solo falla al iniciar sesión, con un error que no
    // dice nada y parece un problema de contraseña.
    throw new GradleException(
        "SUPABASE_ANON_KEY no parece un JWT válido (largo=${supabaseAnonKey.length()}). " +
        'Revisá el secret en GitHub: tiene que ser el anon key completo, ' +
        'de una sola pieza y sin cortes.')
}

// Identidad de la build. GITHUB_RUN_NUMBER sube de a uno en cada corrida
// del workflow, así que sirve de versionCode; el SHA corto dice
// exactamente qué commit se está corriendo en el celular.
def versionDeCI = System.getenv('GITHUB_RUN_NUMBER')
def commitCorto = (System.getenv('GITHUB_SHA') ?: 'local').take(7)

android {
    namespace 'com.tesis.vimed'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.tesis.vimed"
        minSdk 24
        targetSdk 36
        // La versión sale del número de corrida de CI y del commit.
        //
        // Con versionCode 1 y versionName "1.0" fijos, TODAS las builds
        // llegaban a Firebase App Distribution llamándose "1.0 (1)": en la
        // lista de versiones no había forma de distinguir la recién subida
        // de una de hace tres días, salvo mirando la fecha. Es muy fácil
        // instalar la equivocada y creer que un cambio no se aplicó.
        //
        // Compilando desde Android Studio no hay esas variables, así que
        // queda "1.0-local" y el código en 1.
        versionCode versionDeCI ? versionDeCI.toInteger() : 1
        versionName versionDeCI ? "1.0.${versionDeCI} (${commitCorto})" : "1.0-local"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // No es secreto: identifica al proyecto, no autoriza nada por sí
        // solo. Google valida además el paquete y la huella de la firma.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"131576549722-130uhd6v0208a9009h34c6ddknr6sfvd.apps.googleusercontent.com\""

        buildConfigField "String", "OPENAI_API_KEY",   "\"${openAiKey}\""
        buildConfigField "String", "OPENAI_MODELO",    "\"${openAiModelo}\""

        buildConfigField "String", "SUPABASE_URL",      "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""

        // Además del placeholder del manifest, la clave se expone acá para
        // que la pantalla del mapa pueda avisar cuando falta, en vez de
        // mostrar un rectángulo gris sin explicación.
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""

        // Clave del mapa. Va como placeholder del manifest y no como
        // BuildConfig porque el SDK de Maps la lee de ahí.
        //
        // Sin clave la app COMPILA igual y el mapa se abre en gris: es a
        // propósito, para que quien clone el repo sin la clave no se
        // encuentre con un build roto sino con una pantalla que se explica
        // sola (ver el aviso en SeleccionarUbicacionActivity).
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }

    buildFeatures {
        buildConfig = true
    }

    // Clave de firma COMPARTIDA entre tu máquina y GitHub Actions.
    // Sin esto cada entorno firma con su propia clave de debug y los APK
    // no se pueden instalar uno encima del otro (Android los ve como apps
    // distintas y obliga a desinstalar, perdiendo los datos).
    //
    // OJO: esta clave es solo para pruebas. Para publicar en Play Store
    // hay que generar una clave de release aparte y NO commitearla.
    signingConfigs {
        testing {
            storeFile     rootProject.file('vimed-testing.jks')
            storePassword 'vimedtesting'
            keyAlias      'vimed'
            keyPassword   'vimedtesting'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testing
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.testing
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // RecyclerView (listas de medicamentos, chat, tomas, citas)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Supabase REST (PostgREST) vía Retrofit
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging

    // Push al cuidador (FCM). La dependencia va siempre para que el código
    // compile; lo condicional es el plugin de arriba. Sin google-services.json
    // Firebase no llega a inicializarse en runtime y PushManager lo ignora.
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    // Lector de texto de la caja del medicamento. Corre entero en el
    // celular: la foto de una caja de medicación es un dato de salud y no
    // tiene por qué salir del aparato.
    //
    // Esta variante deja el modelo en Google Play Services en vez de
    // empaquetarlo. Medido sobre este APK:
    //
    //     empaquetado (com.google.mlkit:text-recognition)  48.8 MB
    //     por Play Services (esta)                          8.3 MB
    //
    // Son 40 MB, y casi todos de una librería nativa que además viene para
    // cuatro arquitecturas —x86 y x86_64 solo sirven en emuladores—. Esta
    // app se distribuye por datos móviles a gente que la instala una vez;
    // 40 MB ahí pesan mucho más que la comodidad de tenerlo adentro.
    //
    // Depender de Play Services no agrega nada nuevo: ya es obligatorio
    // para el push de Firebase y para el login con Google. Y el modelo no
    // se baja recién en el primer escaneo: el meta-data del manifiesto le
    // pide a Play Services que lo traiga al instalar la app, así que para
    // cuando alguien saque la primera foto ya está listo y funciona sin
    // conexión.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    // Mapa para elegir la ubicación de una cita. Solo el SDK del mapa: la
    // búsqueda por nombre usa el Geocoder de Android, que no se factura.
    implementation 'com.google.android.gms:play-services-maps:19.0.0'

    // Login con Google sin salir de la app (hoja de cuentas nativa).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Google Sign-In (requiere google-services.json en app/)
    // implementation 'com.google.android.gms:play-services-auth:21.0.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
